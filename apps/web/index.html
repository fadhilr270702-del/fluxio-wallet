<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluxio is a non custodial crypto wallet for Solana, Ethereum, BNB Chain and Base. Your keys never leave your device. Swap on Solana. No added fee on transfers." />
    <!-- Canonical for "/" (prompt 0207, Search Console "duplicate without
         user-selected canonical"): the / route's static default; Shell()
         keeps it in sync per route (see App.jsx). -->
    <link rel="canonical" href="https://fluxiowallet.com/" />
    <!-- Social sharing meta (prompt 0207): og image is a copy of the CWS
         marquee (public/og-image.png, 1400x560). -->
    <meta property="og:title" content="Fluxio Wallet: non custodial wallet for Solana, Ethereum, BNB Chain and Base" />
    <meta property="og:description" content="Fluxio is a non custodial crypto wallet for Solana, Ethereum, BNB Chain and Base. Your keys never leave your device. Swap on Solana. No added fee on transfers." />
    <meta property="og:url" content="https://fluxiowallet.com/" />
    <meta property="og:image" content="https://fluxiowallet.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600..900&display=swap"
      rel="stylesheet"
    />
    <title>Fluxio Wallet: non custodial wallet for Solana, Ethereum, BNB Chain and Base</title>
    <script>
      // Applied synchronously, before first paint, so a returning visitor's
      // saved theme doesn't flash light-then-dark (or vice versa) while
      // React boots. Mirrors what useTheme.js persists to localStorage.
      try {
        var t = localStorage.getItem('fluxio-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
